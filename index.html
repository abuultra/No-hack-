<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>ADX MADARA - ULTRA V5</title>
  <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@700&family=Poppins:wght@600;800&family=Oswald:wght@700&display=swap" rel="stylesheet">
  <style>
    :root { 
      --selection-bg: #0a0a0a; 
      --panther-yellow: #ffc107;
      --yellow-3d: linear-gradient(145deg, #ffeb3b, #fbc02d);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Poppins', sans-serif; background: var(--selection-bg); height: 100vh; width: 100vw; overflow: hidden; }

    #selection-page { position: fixed; inset: 0; background: var(--selection-bg); z-index: 20000; overflow-y: auto; display: block; touch-action: pan-y; }
    
    .app-header { background: #111; padding: 10px; display: flex; align-items: center; justify-content: center; border-bottom: 2px solid #222; position: sticky; top: 0; z-index: 100; height: 70px; }

    .neon-title { width: 100%; height: 50px; }
    .neon-text {
      font-family: 'El Messiri', sans-serif; font-size: 26px; font-weight: 700;
      fill: none; stroke: var(--panther-yellow); stroke-width: 1.2; stroke-dasharray: 120;
      animation: drawText 4s infinite alternate;
      filter: drop-shadow(0 0 8px var(--panther-yellow));
    }
    @keyframes drawText { 
      0% { stroke-dashoffset: 120; fill: rgba(255, 193, 7, 0); }
      100% { stroke-dashoffset: 0; fill: rgba(255, 193, 7, 1); }
    }

    .game-list { padding: 15px; display: flex; flex-direction: column; gap: 12px; }
    
    .game-card { 
      background: #1a1a1a; border-radius: 15px; padding: 10px 15px; 
      position: relative; overflow: hidden;
      border: 1px solid #333;
      display: flex; align-items: center; justify-content: space-between;
      height: 85px; 
    }
    .game-card::before {
      content: ""; position: absolute; inset: -2px;
      background: linear-gradient(90deg, #ff0000, #ffc107, #00ff00, #ffc107, #ff0000);
      background-size: 400%; z-index: -1; animation: borderAnim 8s linear infinite;
      opacity: 0.5;
    }
    @keyframes borderAnim { 0% { background-position: 0% 0%; } 100% { background-position: 400% 0%; } }

    .card-left { display: flex; align-items: center; gap: 12px; }
    
    .card-info img { 
      width: 50px; height: 50px; border-radius: 50%; 
      object-fit: cover; border: 2px solid var(--panther-yellow); 
    }
    .card-info span { font-weight: 700; color: #fff; font-size: 14px; letter-spacing: 0.5px; }

    .start-btn { 
      background: var(--panther-yellow); color: #000; padding: 8px 15px; border-radius: 10px; 
      font-weight: 900; font-size: 12px; border: none; cursor: pointer;
      box-shadow: 0 4px 0 #b38600;
    }

    .panther-panel {
      position: fixed; width: 250px; background: #fff; border-radius: 20px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 10000; display: none;
      flex-direction: column; overflow: hidden; touch-action: none; will-change: transform;
    }
    .p-hdr { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; }
    
    .panel-svg-title { width: 120px; height: 25px; background: #000; border-radius: 4px; padding: 2px; }
    .panel-text {
      font-size: 12px; font-weight: 900; fill: #fff; /* TITLE TEXT WHITE */
      stroke: var(--panther-yellow);
      stroke-width: 0.4;
    }

    .p-logo { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; border: 2px solid var(--panther-yellow); }
    .p-logo img { width: 100%; height: 100%; object-fit: cover; }
    
    /* YELLOW BACKGROUND WITH WHITE TEXT AS REQUESTED */
    .p-info-bar { 
      background: var(--panther-yellow); 
      padding: 5px 12px; 
      display: flex; 
      justify-content: space-between; 
      color: #fff; /* Text white */
      font-weight: 800; 
      font-size: 10px; 
    }
    
    .p-content { height: 100px; display: flex; align-items: center; justify-content: center; background: #f9f9f9; }
    
    .big-res { 
      font-family: 'Oswald', sans-serif; font-size: 55px; color: var(--panther-yellow); 
      text-shadow: 2px 2px 0 #000;
      transform: skewX(15deg);
    }
    
    .num-box { display: flex; gap: 10px; transform: skewX(15deg); }
    .num-circle { 
      width: 55px; height: 55px; background: var(--yellow-3d); border-radius: 12px; 
      display: flex; align-items: center; justify-content: center; 
      color: #fff; 
      font-size: 30px; font-weight: 900; 
      box-shadow: 0 6px 0 #c79a00, 0 8px 10px rgba(0,0,0,0.2);
    }

    .p-footer { display: flex; gap: 8px; padding: 12px; }
    .p-btn { 
      flex: 1; 
      background: var(--yellow-3d); 
      color: #000; 
      padding: 10px; 
      border-radius: 8px; 
      text-align: center; 
      font-weight: 900; 
      font-size: 11px; 
      border: none; 
      cursor: pointer;
      box-shadow: 0 4px 0 #b38600;
    }
    .p-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b38600; }

    .min-circle { 
      width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--panther-yellow); 
      background: #000; position: fixed; z-index: 10001; display: none; overflow: hidden; 
      box-shadow: 0 0 15px var(--panther-yellow); touch-action: none;
    }
    .min-circle img { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>

  <div id="selection-page">
    <div class="app-header">
      <svg class="neon-title" viewBox="0 0 300 50">
        <text x="50%" y="70%" text-anchor="middle" class="neon-text">ADX MADARA</text>
      </svg>
    </div>
    <div class="game-list">
      <div class="game-card"><div class="card-left"><div class="card-info"><img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000498307.jpg?alt=media&token=7867760e-6421-45fb-917e-4f9f10fda8ba"></div><div class="card-info"><span>JALWA GAME</span></div></div><button class="start-btn" onclick="launch('https://www.jalwagame.com/#/')">START</button></div>
      <div class="game-card"><div class="card-left"><div class="card-info"><img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000498310.jpg?alt=media&token=a992dc50-1761-40e7-b1e6-ef39315f5dc0"></div><div class="card-info"><span>TASHAN WIN</span></div></div><button class="start-btn" onclick="launch('https://tashanwin.limo/#/register?invitationCode=65877100009')">START</button></div>
      <div class="game-card"><div class="card-left"><div class="card-info"><img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000498311.jpg?alt=media&token=8255603c-c5e6-489f-86b2-a075886b4064"></div><div class="card-info"><span>IN999</span></div></div><button class="start-btn" onclick="launch('https://in999cc.com/#/register?invitationCode=62173925545')">START</button></div>
      <div class="game-card"><div class="card-left"><div class="card-info"><img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000498309.png?alt=media&token=7ea4e68a-5086-4554-8978-a3bacb532c19"></div><div class="card-info"><span>DAMAN</span></div></div><button class="start-btn" onclick="launch('https://damanworld.top/#/register?r_code=dIjso1685078')">START</button></div>
      <div class="game-card"><div class="card-left"><div class="card-info"><img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000498308.ico?alt=media&token=753d2e05-6321-464c-abcb-0ad1a7ad2356"></div><div class="card-info"><span>51 LOTTERY</span></div></div><button class="start-btn" onclick="launch('https://51game5.com/#/register?invitationCode=143844032404')">START</button></div>
    </div>
  </div>

  <iframe id="game-frame" style="position:fixed; inset:0; width:100%; height:100%; border:none; display:none; z-index:1;"></iframe>

  <div id="panel1" class="panther-panel" style="top: 100px; left: 20px;">
    <div class="p-hdr">
      <svg class="panel-svg-title" viewBox="0 0 120 25"><text x="50%" y="70%" text-anchor="middle" class="panel-text">MADARA ALPHA</text></svg>
      <div class="p-logo"><img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000487147.jpg?alt=media&token=3f39126f-cfcc-4d1b-a6b1-f566cb1854c0"></div>
    </div>
    <div class="p-info-bar"><span id="p1-period">WAIT...</span><span id="p1-timer">00:00</span></div>
    <div class="p-content"><div class="big-res" id="p1-res">BIG</div></div>
    <div class="p-footer"><button class="p-btn" onclick="goBack()">EXIT</button><button class="p-btn" onclick="minPanel('panel1','min1')">CLOSE</button></div>
  </div>

  <div id="panel2" class="panther-panel" style="top: 380px; left: 20px;">
    <div class="p-hdr">
      <svg class="panel-svg-title" viewBox="0 0 120 25"><text x="50%" y="70%" text-anchor="middle" class="panel-text">NUMBER</text></svg>
      <div class="p-logo"><img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000487147.jpg?alt=media&token=3f39126f-cfcc-4d1b-a6b1-f566cb1854c0"></div>
    </div>
    <div class="p-info-bar"><span>SERVER: LIVE</span><span>V2.6</span></div>
    <div class="p-content"><div class="num-box"><div class="num-circle" id="n1">0</div><div class="num-circle" id="n2">5</div></div></div>
    <div class="p-footer"><button class="p-btn" onclick="goBack()">EXIT</button><button class="p-btn" onclick="minPanel('panel2','min2')">CLOSE</button></div>
  </div>

  <div id="min1" class="min-circle" onclick="showPanel('panel1','min1')"><img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000487147.jpg?alt=media&token=3f39126f-cfcc-4d1b-a6b1-f566cb1854c0"></div>
  <div id="min2" class="min-circle" onclick="showPanel('panel2','min2')"><img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000487147.jpg?alt=media&token=3f39126f-cfcc-4d1b-a6b1-f566cb1854c0"></div>

  <script>
    function launch(url) {
      document.getElementById('selection-page').style.display = 'none';
      const f = document.getElementById('game-frame'); f.src = url; f.style.display = 'block';
      document.getElementById('panel1').style.display = 'flex'; document.getElementById('panel2').style.display = 'flex';
    }
    function goBack() {
      document.getElementById('game-frame').style.display = 'none'; document.getElementById('game-frame').src = "";
      document.getElementById('panel1').style.display = 'none'; document.getElementById('panel2').style.display = 'none';
      document.getElementById('min1').style.display = 'none'; document.getElementById('min2').style.display = 'none';
      document.getElementById('selection-page').style.display = 'block';
    }
    function minPanel(p, m) { document.getElementById(p).style.display='none'; document.getElementById(m).style.display='block'; }
    function showPanel(p, m) { document.getElementById(p).style.display='flex'; document.getElementById(m).style.display='none'; }

    function makeMoveable(el) {
      let active = false, startX, startY;
      const onStart = (e) => { if (e.target.tagName === 'BUTTON') return; active = true; const t = e.touches ? e.touches[0] : e; startX = t.clientX - el.offsetLeft; startY = t.clientY - el.offsetTop; };
      const onMove = (e) => { if (!active) return; const t = e.touches ? e.touches[0] : e; window.requestAnimationFrame(() => { el.style.left = (t.clientX - startX) + 'px'; el.style.top = (t.clientY - startY) + 'px'; }); };
      el.addEventListener('mousedown', onStart); el.addEventListener('touchstart', onStart, {passive: false});
      window.addEventListener('mousemove', onMove); window.addEventListener('touchmove', onMove, {passive: false});
      window.addEventListener('mouseup', () => active = false); window.addEventListener('touchend', () => active = false);
    }

    makeMoveable(document.getElementById('panel1')); makeMoveable(document.getElementById('panel2'));
    makeMoveable(document.getElementById('min1')); makeMoveable(document.getElementById('min2'));

    setInterval(async () => {
        try {
            const res = await fetch(`https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json?ts=${Date.now()}`);
            const d = await res.json();
            const nextP = (BigInt(d.data.list[0].issueNumber) + 1n).toString();
            document.getElementById('p1-period').innerText = nextP;
            let sec = 60 - new Date().getSeconds();
            document.getElementById('p1-timer').innerText = "00:" + (sec < 10 ? "0"+sec : sec);
            if (sec === 59) {
                document.getElementById('p1-res').innerText = Math.random() > 0.5 ? "BIG" : "SMALL";
                document.getElementById('n1').innerText = Math.floor(Math.random()*10);
                document.getElementById('n2').innerText = Math.floor(Math.random()*10);
            }
        } catch(e){}
    }, 1000);
  </script>
</body>
</html>
